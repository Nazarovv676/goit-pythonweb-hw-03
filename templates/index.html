<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Message App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="header-content">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo">
            <h1>Flask Message App</h1>
        </div>
        <nav>
            <ul>
                <li><a href="{{ url_for('index') }}">Home</a></li>
                <li><a href="{{ url_for('message') }}">Send Message</a></li>
                <li><a href="{{ url_for('read') }}">Read Messages</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="container">
            <h2>Welcome to Flask!</h2>
            <p>This is a simple Flask web application that allows you to send and read messages.</p>
            <p>Use the navigation above to send a message or view all messages.</p>
        </div>
    </main>
</body>
</html>
